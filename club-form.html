<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放學後社團體驗表</title>
</head>
<body>

    <h1>放學後社團體驗表</h1>
    <p>這是介面練習，資料不會送出或保存，不能當成正式報名。</p>

    <form>
        <!-- 我的暱稱 -->
        <div>
            <label for="nickname">我的暱稱</label><br>
            <input type="text" id="nickname" name="nickname" placeholder="例如小星星">
        </div>
        <br>

        <!-- 想體驗的社團 -->
        <fieldset>
            <legend>想體驗的社團</legend>
            <input type="radio" id="club1" name="club" value="故事劇場">
            <label for="club1">故事劇場</label><br>
            
            <input type="radio" id="club2" name="club" value="科學手作">
            <label for="club2">科學手作</label><br>
            
            <input type="radio" id="club3" name="club" value="桌遊挑戰">
            <label for="club3">桌遊挑戰</label>
        </fieldset>
        <br>

        <!-- 方便參加的日子 -->
        <fieldset>
            <legend>方便參加的日子</legend>
            <input type="checkbox" id="day1" name="days" value="星期二">
            <label for="day1">星期二</label><br>
            
            <input type="checkbox" id="day2" name="days" value="星期四">
            <label for="day2">星期四</label><br>
            
            <input type="checkbox" id="day3" name="days" value="星期五">
            <label for="day3">星期五</label>
        </fieldset>
        <br>

        <!-- 我期待的活動方式 -->
        <fieldset>
            <legend>我期待的活動方式</legend>
            <input type="checkbox" id="mode1" name="modes" value="動手製作">
            <label for="mode1">動手製作</label><br>
            
            <input type="checkbox" id="mode2" name="modes" value="和同學合作">
            <label for="mode2">和同學合作</label><br>
            
            <input type="checkbox" id="mode3" name="modes" value="上台分享">
            <label for="mode3">上台分享</label>
        </fieldset>
        <br>

        <!-- 想告訴老師的事 -->
        <div>
            <label for="message">想告訴老師的事</label><br>
            <textarea id="message" name="message" rows="4" cols="40" placeholder="例如我想和同學一起完成一個小作品"></textarea>
        </div>

    </form>

</body>
</html>
